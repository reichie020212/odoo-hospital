# Optional reverse-proxy layer for prod.
#
# Layer this on top of the base + prod compose files when you want nginx
# in front of Odoo. The nginx config (./nginx/default.conf) routes
# /websocket and /longpolling/ to the gevent worker on port 8072 and
# everything else to the HTTP worker on port 8069 — required when Odoo
# runs with --workers >= 1.
#
# Usage:
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.prod.yml \
#     -f docker-compose.nginx.yml \
#     up -d
#
# If port 80 is already in use on the host, change the left side of the
# mapping below (e.g. "8088:80") and point your upstream at that port.
services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - odoo
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
