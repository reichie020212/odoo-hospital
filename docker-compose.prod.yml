services:
  db:
    restart: unless-stopped

  odoo:
    image: hms-odoo:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      - odoo
      - --config=/etc/odoo/odoo.conf
      - --workers=2
      # --proxy-mode is required when Odoo sits behind a reverse proxy
      # (our optional docker-compose.nginx.yml, Cloudflare, an upstream
      # load balancer, etc.). It tells Odoo to trust the X-Forwarded-*
      # headers the proxy sets so absolute URLs (emails, OAuth callbacks,
      # the public website) are generated with the correct scheme/host.
      # If you ever expose Odoo *directly* to untrusted clients without
      # any proxy in front, drop this flag.
      - --proxy-mode
