# nginx reverse proxy for Odoo 19 with workers (multi-process mode).
#
# Why this exists: when Odoo runs with `--workers=N`, the HTTP workers on
# port 8069 cannot handle WebSocket upgrades — those have to go to the
# gevent worker on port 8072. nginx routes /websocket and /longpolling/
# to 8072 and everything else to 8069.
#
# DNS resolution: we deliberately do NOT use `upstream { server odoo:...; }`
# blocks because nginx resolves those at config-load time, and if the
# `odoo` container hasn't joined the docker network yet, nginx aborts
# with "host not found in upstream". Instead we put the backend address
# in a $variable and let nginx resolve it via Docker's embedded DNS
# (127.0.0.11) on each request. nginx now starts cleanly even when odoo
# is briefly unavailable.
#
# The Odoo container must be started with --proxy-mode (set in
# docker-compose.prod.yml) so it trusts the X-Forwarded-* headers
# nginx sets below.

# Docker's embedded DNS server. `valid=10s` re-resolves at most every
# 10 seconds, so a container restart that gives Odoo a new IP is picked
# up quickly. ipv6=off avoids spurious AAAA lookups.
resolver 127.0.0.11 valid=10s ipv6=off;

# Map the Connection header so WebSocket Upgrade works correctly even
# when the client sends Connection: keep-alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Generous timeouts — Odoo long-running requests (reports, imports)
    # can legitimately take a while.
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    # Standard forwarded-headers. Odoo (with --proxy-mode) reads these to
    # build correct absolute URLs for the public site.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Allow large uploads (PDFs, attachments, db dumps via the manager).
    client_max_body_size    200M;
    client_body_buffer_size 128k;

    # WebSocket — must hit the gevent worker. The $upstream variable is
    # what triggers lazy DNS resolution via the resolver above.
    location /websocket {
        set $upstream http://odoo:8072;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Long-polling fallback for older clients / odd network paths.
    location /longpolling/ {
        set $upstream http://odoo:8072;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Cache Odoo's static assets aggressively — they are versioned via
    # the URL, so far-future expiry is safe.
    location ~* /web/static/ {
        set $upstream http://odoo:8069;
        proxy_cache_valid 200 90m;
        proxy_buffering   on;
        expires           864000;
        proxy_pass        $upstream;
    }

    # Everything else → regular HTTP worker.
    location / {
        set $upstream http://odoo:8069;
        proxy_pass     $upstream;
        proxy_redirect off;
    }

    # Compress responses where it pays off.
    gzip            on;
    gzip_min_length 1100;
    gzip_buffers    4 32k;
    gzip_types      text/plain text/xml text/css application/javascript application/json application/xml;
    gzip_vary       on;
}
