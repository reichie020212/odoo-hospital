# nginx reverse proxy for Odoo 19 with workers (multi-process mode).
#
# Why this exists: when Odoo runs with `--workers=N`, the HTTP workers on
# port 8069 cannot handle WebSocket upgrades — those have to go to the
# gevent worker on port 8072. nginx routes /websocket and /longpolling/
# to 8072 and everything else to 8069.
#
# The Odoo container must be started with --proxy-mode (set in
# docker-compose.prod.yml) so it trusts the X-Forwarded-* headers nginx
# sets below.

upstream odoo {
    server odoo:8069;
}

upstream odoochat {
    server odoo:8072;
}

# Map the Connection header so WebSocket Upgrade works correctly even
# when the client sends Connection: keep-alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Generous timeouts — Odoo long-running requests (reports, imports)
    # can legitimately take a while.
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    # Standard forwarded-headers. Odoo (with --proxy-mode) reads these to
    # build correct absolute URLs for the public site.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Allow large uploads (PDFs, attachments, db dumps via the manager).
    client_max_body_size 200M;

    # WebSocket — must hit the gevent worker.
    location /websocket {
        proxy_pass http://odoochat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Long-polling fallback for older clients / odd network paths.
    location /longpolling/ {
        proxy_pass http://odoochat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Cache Odoo's static assets aggressively — they are versioned via
    # the URL, so far-future expiry is safe.
    location ~* /web/static/ {
        proxy_cache_valid 200 90m;
        proxy_buffering   on;
        expires           864000;
        proxy_pass        http://odoo;
    }

    # Everything else → regular HTTP worker.
    location / {
        proxy_pass     http://odoo;
        proxy_redirect off;
    }

    # Compress responses where it pays off.
    gzip            on;
    gzip_min_length 1100;
    gzip_buffers    4 32k;
    gzip_types      text/plain text/xml text/css application/javascript application/json application/xml;
    gzip_vary       on;

    # Buffer slightly oversized request bodies on disk instead of failing.
    client_body_buffer_size 128k;
}
